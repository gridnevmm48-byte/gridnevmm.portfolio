<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maksim Gridnev, AI-Native Product Designer</title>
    <meta
      name="description"
      content="Portfolio of Maksim Gridnev. Designing product interfaces and digital experiences with AI"
    />
    <meta name="author" content="Maksim Gridnev" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social Media Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maksim Gridnev, AI-Native Product Designer" />
    <meta
      property="og:description"
      content="Designing product interfaces and digital experiences with AI"
    />
    <!-- Without this a shared link is a bare line of text; with it, chat apps
         and LinkedIn render the hero as the preview card. -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />

    <style>
      /* min-height, not height: the page is one long scrolling column, and a
         fixed 100% would cut the box off at the first viewport. */
      html,
      body {
        min-height: 100%;
        margin: 0;
        background-color: #000000;
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
